services:
  terminal:
    environment:
      LAYA_URL: http://host.docker.internal:8092
  trainer:
    image: okx-training-lab:0.1.0
    build:
      context: .
      dockerfile: trainer/Dockerfile
      target: trainer
    networks: [market]
    environment:
      TRAINING_DIR: /training
      LAYA_URL: http://host.docker.internal:8092
    volumes: ["training-data:/training"]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    pids_limit: 64
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}
