name: okx-tradingterminal
x-logging: &local-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  terminal:
    logging: *local-logs
    image: okx-tradingterminal:0.4.0
    build: .
    ports:
      - "127.0.0.1:4780:8080"
    environment:
      EXECUTION_MODE: PAPER_LOCAL
      DATABASE_HOST: db
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      RUST_LOG: info
      SETTINGS_DIR: /settings
      TRAINING_DIR: /training
    secrets:
      - db_password
      - local_secrets_key
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pine-jobs:/jobs
      - market-archives:/archives
      - training-data:/training
      - ./.local/provider-settings:/settings
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    networks: [market, storage]
  orders-demo:
    logging: *local-logs
    image: okx-tradingterminal:0.4.0
    entrypoint: ["/app/okx-orders"]
    environment:
      EXECUTION_MODE: OKX_DEMO
      DATABASE_HOST: db
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      SETTINGS_DIR: /settings
      TRAINING_DIR: /training
    secrets: [db_password, local_secrets_key]
    depends_on:
      db:
        condition: service_healthy
      terminal:
        condition: service_healthy
    volumes: ["./.local/provider-settings:/settings:ro"]
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      disable: true
    restart: unless-stopped
    networks: [market, storage]
  orders-live:
    logging: *local-logs
    image: okx-tradingterminal:0.4.0
    entrypoint: ["/app/okx-orders"]
    environment:
      EXECUTION_MODE: LIVE
      DATABASE_HOST: db
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      SETTINGS_DIR: /settings
      TRAINING_DIR: /training
    secrets: [db_password, local_secrets_key]
    depends_on:
      db:
        condition: service_healthy
      terminal:
        condition: service_healthy
    volumes: ["./.local/provider-settings:/settings:ro"]
    read_only: true
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      disable: true
    restart: unless-stopped
    networks: [market, storage]
  pine:
    logging: *local-logs
    build: ./pine-worker
    image: okx-pine-worker:0.3.0
    network_mode: none
    read_only: true
    user: "10001:10001"
    volumes: ["pine-jobs:/jobs"]
    tmpfs: ["/tmp:size=8m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 32
    restart: unless-stopped
  db:
    logging: *local-logs
    image: okx-postgres:18.6
    build: ./postgres
    user: postgres
    environment:
      POSTGRES_USER: terminal
      POSTGRES_DB: terminal
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres-data:/var/lib/postgresql
    tmpfs: [/tmp, /var/run/postgresql]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U terminal -d terminal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [storage]
secrets:
  local_secrets_key:
    file: ./.local/secrets.key
  db_password:
    file: ./.local/db_password
networks:
  market:
    ipam:
      config:
        - subnet: 10.231.78.0/28
  storage:
    internal: true
    ipam:
      config:
        - subnet: 10.231.79.0/28
volumes:
  postgres-data: {}
  pine-jobs: {}
  market-archives: {}
  training-data: {}
