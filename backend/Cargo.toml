[package]
name = "okx-terminal"
version = "0.4.0"
edition = "2024"

[dependencies]
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.53.1", features = ["full"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "query"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rust_decimal = { version = "=1.43.0", features = ["serde-str"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "migrate", "macros"] }
tower-http = { version = "=0.7.1", features = ["fs", "trace", "set-header"] }
futures-util = "=0.3.34"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

parquet = { version = "=60.0.0", default-features = false, features = ["snap"] }

ring = "=0.17.14"
base64 = "=0.23.1"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
